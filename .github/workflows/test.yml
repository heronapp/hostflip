name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macOS minutes are free on the public repository only; the private mirror skips this job.
    if: github.repository == 'heronapp/hostflip'
    # macos-15 tops out at Xcode 26.3 (Swift 6.2), older than the toolchain releases are built with.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)"
          swift --version
      - name: Run the test suite
        run: swift test
